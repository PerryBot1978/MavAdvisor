<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    #shared-sidebar {
        width: 268px;
        min-height: 100vh;
        background: rgba(12, 16, 26, 0.88);
        border-right: 1px solid rgba(255,255,255,0.1);
        display: flex;
        flex-direction: column;
        padding: 28px 0 18px;
        backdrop-filter: blur(18px);
        flex-shrink: 0;
        box-shadow: inset -1px 0 0 rgba(91,141,238,0.15), inset 0 0 40px rgba(91,141,238,0.08);
        font-family: 'Sora', system-ui, sans-serif;
    }

    #shared-sidebar .user-section {
        padding: 0 22px 28px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    #shared-sidebar .user-avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3a5bd9, #5b8dee);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #fff;
    }

    #shared-sidebar .user-name { font-size: 16px; font-weight: 600; color: #f8fafc; }

    #shared-sidebar .user-level {
        font-size: 13px;
        color: #5b8dee;
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 3px 0;
    }

    #shared-sidebar .user-level::before { content: '✦'; font-size: 10px; }
    #shared-sidebar .user-dept { font-size: 13px; color: #5a6478; }

    #shared-sidebar .user-email {
        font-size: 13px;
        color: #8a95a8;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        line-height: 1.35;
    }

    #shared-sidebar .user-email::before { content: '✉'; font-size: 12px; }

    #shared-sidebar nav { padding: 22px 14px 0; flex: 1; }

    #shared-sidebar .nav-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #5a6478;
        text-transform: uppercase;
        padding: 0 8px;
        margin-bottom: 8px;
    }

    #shared-sidebar .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        color: #8a95a8;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 2px;
        text-decoration: none;
    }

    #shared-sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: #f8fafc; }

    #shared-sidebar .nav-item.active {
        background: linear-gradient(90deg, rgba(91,141,238,0.25), rgba(91,141,238,0.08));
        color: #5b8dee;
        border-left: 2px solid #5b8dee;
    }

    #shared-sidebar .nav-icon { font-size: 16px; width: 22px; text-align: center; }
    #shared-sidebar .nav-group { margin-top: 22px; }

    #shared-sidebar .logout {
        margin: 14px 14px 12px;
        padding: 11px 14px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #8a95a8;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: 'Sora', sans-serif;
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(8px);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    }

    #shared-sidebar .logout:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(91,141,238,0.4);
        color: #f8fafc;
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.12);
    }

    @media (max-width: 900px) {
        #shared-sidebar {
            width: 100%;
            min-height: auto;
        }
    }
</style>

<aside id="shared-sidebar">
    <div class="user-section">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-name" id="user-name">Student</div>
        <div class="user-level" id="user-level">Student</div>
        <div class="user-dept" id="user-dept">Major</div>
        <div class="user-email" id="user-email">student@mavs.uta.edu</div>
    </div>

    <nav>
        <div class="nav-label">Main</div>
        <a class="nav-item" href="/user/dashboard"><span class="nav-icon">▦</span> Dashboard</a>
        <a class="nav-item" href="/user/course-planner"><span class="nav-icon">📅</span> Course Planner</a>
        <a class="nav-item" href="/user/ai-assistant"><span class="nav-icon">✦</span> AI Assistant</a>

        <div class="nav-group">
            <div class="nav-label">Campus</div>
            <a class="nav-item" href="/user/clubs"><span class="nav-icon">⊞</span> Clubs &amp; Orgs</a>
            <a class="nav-item" href="/user/event-calendar"><span class="nav-icon">🗓</span> Event Calendar</a>
            <a class="nav-item" href="/user/certificates"><span class="nav-icon">🎓</span> Certifications</a>
        </div>

        <div class="nav-group">
            <div class="nav-label">Account</div>
            <a class="nav-item" href="/user/account-management"><span class="nav-icon">⚙</span> Account Settings</a>
        </div>
    </nav>

    <button type="button" class="logout" id="btnLogout"><span>⎋</span> Log Out</button>
</aside>

<script src="{{ url_for('runtime_config_js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const username = sessionStorage.getItem('username');

    if (username) {
        document.getElementById('user-name').textContent = username;
        document.getElementById('user-avatar').textContent = username.slice(0, 1).toUpperCase();
    }

    const navLinks = document.querySelectorAll('#shared-sidebar .nav-item[href^="/user/"]');
    navLinks.forEach(function(link) {
        if (username) {
            try {
                const url = new URL(link.getAttribute('href'), window.location.origin);
                url.searchParams.set('username', username);
                link.setAttribute('href', url.pathname + url.search);
            } catch (err) {
                console.warn('Unable to set username on sidebar link', err);
            }
        }

        const href = link.getAttribute('href') || '';
        if (window.location.pathname === href.split('?')[0]) {
            link.classList.add('active');
        }
    });

    if (username && typeof API_BASE_URL === 'string') {
        fetch(API_BASE_URL + '/api/user/' + encodeURIComponent(username))
            .then(function(resp) { return resp.json(); })
            .then(function(result) {
                if (!result.success || !result.data) {
                    return;
                }
                const data = result.data;
                document.getElementById('user-level').textContent = data.classification || 'Student';
                document.getElementById('user-dept').textContent = data.major || 'Major';
                document.getElementById('user-email').textContent = data.email || 'student@mavs.uta.edu';
            })
            .catch(function(err) {
                console.warn('Could not load sidebar profile data', err);
            });
    }

    const btnLogout = document.getElementById('btnLogout');
    if (btnLogout) {
        btnLogout.addEventListener('click', function() {
            sessionStorage.removeItem('username');
            localStorage.removeItem('username');
            window.location.href = '/';
        });
    }
});
</script>
