<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MavAdvisor{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100vh;
            background-color: #2c3e50;
            padding: 0;
            margin: 0;
            z-index: 1000;
        }
        .main-content {
            margin-left: 200px;
            padding: 20px;
            min-height: 100vh;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
<div class="sidebar">
    {% include 'sidebar.html' %}
</div>
<div class="main-content">
    {% block content %}{% endblock %}
</div>
</body>
</html>
