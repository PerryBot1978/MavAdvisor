<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Calendar - MavAdvisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-card: rgba(20, 28, 42, 0.78);
            --accent-blue: #5b8dee;
            --accent-orange: #e07b39;
            --text-primary: #e8eaf0;
            --text-secondary: #8a95a8;
            --text-muted: #5a6478;
            --border: rgba(255,255,255,0.07);
        }

        html, body {
            height: 100%;
            min-height: 100vh;
        }

        body {
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            height: 100%;
            display: flex;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            background: #0a0f18;
        }

        .bg {
            position: fixed;
            inset: 0;
            background-image: url("{{ url_for('static', filename='images/background.png') }}");
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 12, 22, 0.55);
            z-index: 1;
        }

        .layout {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100%;
            min-height: 100vh;
            height: 100%;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
            height: 100%;
        }

        .topbar {
            padding: 32px 36px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(10,15,25,0.3);
            backdrop-filter: blur(8px);
            gap: 12px;
            flex-wrap: wrap;
        }

        .page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }

        .month-badge {
            background: linear-gradient(135deg, #4a7de8, #7b5ce8);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            min-height: 0;
        }

        .content {
            scrollbar-width: thin;
            scrollbar-color: rgba(91,141,238,0.55) rgba(255,255,255,0.05);
        }

        .content::-webkit-scrollbar { width: 10px; height: 10px; }
        .content::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 10px; }
        .content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(91,141,238,0.8), rgba(123,92,232,0.75));
            border-radius: 10px;
            border: 2px solid rgba(10,14,24,0.7);
        }

        .cal-card,
        .types-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            padding: 28px;
        }

        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 26px;
            flex-wrap: wrap;
        }

        .cal-nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'Sora', sans-serif;
            transition: background 0.2s;
        }

        .cal-nav-btn:hover { background: rgba(255,255,255,0.12); }
        .cal-month-label { font-size: 24px; font-weight: 700; min-width: 180px; text-align: center; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

        .cal-dow {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-blue);
            padding-bottom: 12px;
        }

        .cal-cell {
            min-height: 102px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: background 0.2s;
        }

        .cal-cell:hover { background: rgba(255,255,255,0.06); }
        .cal-cell.empty { background: transparent; border-color: transparent; }
        .cal-cell.today { border-color: var(--accent-blue); }

        .day-num {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            line-height: 1;
        }

        .cal-cell.today .day-num { color: var(--accent-blue); }

        .evt {
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            cursor: pointer;
        }

        .evt-sub {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.85;
            margin-top: 2px;
            line-height: 1.25;
        }

        .evt.academic { background: rgba(160,100,240,0.28); color: #c99ef7; }
        .evt.study { background: rgba(91,141,238,0.28); color: #8db8f5; }
        .evt.career { background: rgba(60,180,120,0.28); color: #6ddba8; }
        .evt.deadline { background: rgba(224,123,57,0.28); color: #f0a06a; }
        .evt.special { background: rgba(100,180,220,0.28); color: #80d0f0; }
        .evt.holiday { background: rgba(180,180,60,0.22); color: #d8d870; }

        .types-card h3 { font-size: 17px; font-weight: 600; margin-bottom: 18px; }
        .types-row { display: flex; gap: 12px; flex-wrap: wrap; }

        .type-pill {
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            font-family: 'Sora', sans-serif;
        }

        .tp-academic { background: rgba(160,100,240,0.35); color: #c99ef7; }
        .tp-study { background: rgba(91,141,238,0.35); color: #8db8f5; }
        .tp-career { background: rgba(60,180,120,0.35); color: #6ddba8; }
        .tp-deadline { background: rgba(224,123,57,0.35); color: #f0a06a; }
        .tp-special { background: rgba(100,180,220,0.35); color: #80d0f0; }
        .tp-holiday { background: rgba(180,180,60,0.28); color: #d8d870; }

        @media (max-width: 1000px) {
            .cal-grid { gap: 6px; }
            .cal-cell { min-height: 92px; }
        }

        @media (max-width: 900px) {
            body { overflow: auto; }
            .layout { flex-direction: column; }
            .topbar { padding: 20px; }
            .content { padding: 20px; }
        }

        @media (max-width: 640px) {
            .page-title { font-size: 22px; }
            .topbar { padding: 16px; }
            .content { padding: 16px; }
            .cal-card,
            .types-card { padding: 16px; }
            .cal-card {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .cal-grid { min-width: 520px; }
            .cal-nav { gap: 10px; }
            .cal-month-label { min-width: 0; font-size: 20px; }
            .month-badge { padding: 10px 14px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="bg-overlay"></div>

    <div class="layout">
        {% include 'sidebar.html' %}

        <main class="main">
            <header class="topbar">
                <div class="page-title">Event Calendar</div>
                <button class="month-badge" id="currentMonthBtn" type="button">This Month</button>
            </header>

            <div class="content">
                <section class="cal-card">
                    <div class="cal-nav">
                        <button class="cal-nav-btn" id="prevBtn" type="button">‹ Previous</button>
                        <div class="cal-month-label" id="monthLabel">April 2026</div>
                        <button class="cal-nav-btn" id="nextBtn" type="button">Next ›</button>
                    </div>

                    <div class="cal-grid" id="calGrid">
                        <div class="cal-dow">SUN</div>
                        <div class="cal-dow">MON</div>
                        <div class="cal-dow">TUE</div>
                        <div class="cal-dow">WED</div>
                        <div class="cal-dow">THU</div>
                        <div class="cal-dow">FRI</div>
                        <div class="cal-dow">SAT</div>
                    </div>
                </section>

                <section class="types-card">
                    <h3>Event Types</h3>
                    <div class="types-row">
                        <button class="type-pill tp-academic" type="button">Academic</button>
                        <button class="type-pill tp-study" type="button">Study Groups</button>
                        <button class="type-pill tp-career" type="button">Career Events</button>
                        <button class="type-pill tp-deadline" type="button">Deadlines</button>
                        <button class="type-pill tp-special" type="button">Special Events</button>
                        <button class="type-pill tp-holiday" type="button">Holidays</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const events = {
            "2026-4-1": [{ label: "Spring Break Begins", cls: "special" }],
            "2026-4-2": [{ label: "Study Group", sub: "3:00 PM · Library", cls: "study" }],
            "2026-4-4": [{ label: "Career Fair", sub: "10:00 AM · UC", cls: "career" }],
            "2026-4-7": [{ label: "Hackathon", sub: "All day · SEIR", cls: "academic" }],
            "2026-4-9": [{ label: "Midterm Exam", sub: "MATH 1426", cls: "academic" }],
            "2026-4-11": [{ label: "Guest Lecture", sub: "2:00 PM · NH 340", cls: "academic" }],
            "2026-4-13": [{ label: "Club Meeting", sub: "After 5:00 PM · ACAC", cls: "study" }],
            "2026-4-15": [{ label: "Spring Break Ends", cls: "special" }],
            "2026-4-17": [{ label: "St. Patrick's Day", cls: "holiday" }],
            "2026-4-19": [{ label: "Registration Opens", sub: "Fall 2026", cls: "deadline" }],
            "2026-4-23": [{ label: "Workshop", sub: "Human Building", cls: "academic" }],
            "2026-4-25": [{ label: "Cover Workshop", sub: "4:00 PM · UC", cls: "career" }],
            "2026-4-27": [{ label: "Deadline", sub: "Scholarship App", cls: "deadline" }]
        };

        let current = new Date(2026, 3, 1);

        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function renderCalendar() {
            const year = current.getFullYear();
            const month = current.getMonth();
            document.getElementById("monthLabel").textContent = `${monthNames[month]} ${year}`;

            const grid = document.getElementById("calGrid");
            const headers = Array.from(grid.querySelectorAll(".cal-dow"));
            grid.innerHTML = "";
            headers.forEach((h) => grid.appendChild(h));

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement("div");
                empty.className = "cal-cell empty";
                grid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement("div");
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
                cell.className = "cal-cell" + (isToday ? " today" : "");

                const num = document.createElement("div");
                num.className = "day-num";
                num.textContent = d;
                cell.appendChild(num);

                const key = `${year}-${month + 1}-${d}`;
                (events[key] || []).forEach((ev) => {
                    const pill = document.createElement("div");
                    pill.className = `evt ${ev.cls}`;
                    pill.textContent = ev.label;
                    if (ev.sub) {
                        const sub = document.createElement("div");
                        sub.className = "evt-sub";
                        sub.textContent = ev.sub;
                        pill.appendChild(sub);
                    }
                    cell.appendChild(pill);
                });

                grid.appendChild(cell);
            }
        }

        document.getElementById("prevBtn").addEventListener("click", function () {
            current.setMonth(current.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById("nextBtn").addEventListener("click", function () {
            current.setMonth(current.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById("currentMonthBtn").addEventListener("click", function () {
            current = new Date();
            current.setDate(1);
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
