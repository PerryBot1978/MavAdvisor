<!-- Sidebar -->
<div id="sidebar" style="width: 200px; background-color: #f0f0f0; padding: 20px; height: 100vh; transition: width 0.3s ease; overflow: hidden;">
    <div id="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="sidebar-title" style="margin: 0; white-space: nowrap; transition: opacity 0.3s ease;">Navigation</h3>
        <button id="toggle-sidebar" style="background: none; border: none; cursor: pointer; font-size: 18px; padding: 5px; color: #555;" title="Collapse sidebar">
            ◀
        </button>
    </div>
    
    <ul id="sidebar-nav" style="list-style-type: none; padding-left: 0; transition: opacity 0.3s ease;">
        <li style="margin-bottom: 10px;">
            <a href="/user/dashboard" style="text-decoration: none; color: #333; display: block; padding: 8px 0; overflow-wrap: break-word; word-wrap: break-word;">Degree Progress</a>
        </li>
        <li style="margin-bottom: 10px;">
            <a href="/user/course-planner" style="text-decoration: none; color: #333; display: block; padding: 8px 0; overflow-wrap: break-word; word-wrap: break-word;">Course Planner</a>
        </li>
        <li style="margin-bottom: 10px;">
            <a href="/user/ai-assistant" style="text-decoration: none; color: #333; display: block; padding: 8px 0; overflow-wrap: break-word; word-wrap: break-word;">AI Assistant</a>
        </li>
        <li style="margin-bottom: 10px;">
            <a href="/user/clubs" style="text-decoration: none; color: #333; display: block; padding: 8px 0; overflow-wrap: break-word; word-wrap: break-word;">Clubs & Organizations</a>
        </li>
        <li style="margin-bottom: 10px;">
            <a href="/user/event-calendar" style="text-decoration: none; color: #333; display: block; padding: 8px 0; overflow-wrap: break-word; word-wrap: break-word;">Event Calendar</a>
        </li>
        <li style="margin-bottom: 10px;">
            <a href="/user/certificates" style="text-decoration: none; color: #333; display: block; padding: 8px 0; overflow-wrap: break-word; word-wrap: break-word;">Certifications</a>
        </li>
        <li style="margin-bottom: 10px;">
            <a href="/user/account-management" style="text-decoration: none; color: #333; display: block; padding: 8px 0; overflow-wrap: break-word; word-wrap: break-word;">Account Management</a>
        </li>
    </ul>
    
    <!-- Log Out Button -->
    <div id="sidebar-logout" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ccc;">
        <a href="/user/login" style="display: block; padding: 10px; background-color: #f44336; color: white; text-align: center; text-decoration: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Log Out
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('sidebar');
    const toggleButton = document.getElementById('toggle-sidebar');
    const navItems = document.getElementById('sidebar-nav');
    const sidebarTitle = document.getElementById('sidebar-title');
    const sidebarHeader = document.getElementById('sidebar-header');
    const sidebarLogout = document.getElementById('sidebar-logout');
    let isCollapsed = false;
    
    toggleButton.addEventListener('click', function() {
        isCollapsed = !isCollapsed;
        
        if (isCollapsed) {
            sidebar.style.width = '50px';
            sidebar.style.padding = '20px 10px';
            sidebarHeader.style.justifyContent = 'center';
            toggleButton.innerHTML = '▶';
            toggleButton.title = 'Expand sidebar';
            sidebarTitle.style.opacity = '0';
            sidebarTitle.style.display = 'none';
            navItems.style.opacity = '0';
            sidebarLogout.style.opacity = '0';
            setTimeout(() => {
                navItems.style.display = 'none';
                sidebarLogout.style.display = 'none';
            }, 300);
        } else {
            sidebar.style.width = '200px';
            sidebar.style.padding = '20px';
            sidebarHeader.style.justifyContent = 'space-between';
            toggleButton.innerHTML = '◀';
            toggleButton.title = 'Collapse sidebar';
            sidebarTitle.style.display = 'block';
            setTimeout(() => {
                sidebarTitle.style.opacity = '1';
            }, 10);
            navItems.style.display = 'block';
            sidebarLogout.style.display = 'block';
            setTimeout(() => {
                navItems.style.opacity = '1';
                sidebarLogout.style.opacity = '1';
            }, 10);
        }
    });
});
</script>
