<!DOCTYPE html>
<body>
<h1>User Registration</h1>

<form method="POST" action="">
    <table cellspacing="10">
        <tr>
            <td align="right"><label for="username">Username:</label></td>
            <td><input type="text" id="username" name="username" required></td>
        </tr>
        <tr>
            <td align="right"><label for="email">Email:</label></td>
            <td><input type="email" id="email" name="email" required></td>
        </tr>
        <tr>
            <td align="right"><label for="password">Password:</label></td>
            <td><input type="password" id="password" name="password" required></td>
        </tr>
        <tr>
            <td align="right"><label for="major">Major:</label></td>
            <td><input type="text" id="major" name="major" required></td>
        </tr>
        <tr>
            <td align="right"><label for="graduation_year">Graduation Year:</label></td>
            <td><input type="number" id="graduation_year" name="graduation_year" min="2026" max="2040" value="2030" required></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <button type="submit">Register</button>
            </td>
        </tr>
    </table>
</form>

</body>
</html>
